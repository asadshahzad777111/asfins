# Artisan Color Configurator — Render deployment (free tier)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: artisan-color-configurator
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
